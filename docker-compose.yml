services:
  mysql:
    image: mysql:8.4
    container_name: saca_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saca_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - saca_mysql_data:/var/lib/mysql
      - ./database/saca_schema.sql:/docker-entrypoint-initdb.d/01-saca-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saca_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/saca_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"

volumes:
  saca_mysql_data: