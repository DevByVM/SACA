services:
  mysql:
    image: mysql:8.4
    container_name: saca_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saca_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "${SACA_MYSQL_PORT:-3307}:3306"
    volumes:
      - saca_mysql_data:/var/lib/mysql
      - ./database/saca_schema.sql:/docker-entrypoint-initdb.d/01-saca-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: saca_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saca_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/saca_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SACA_CORREO_REMITENTE: "${SACA_CORREO_REMITENTE:-SACA UES <no-responder@saca.local>}"
      SACA_FRONTEND_URL: "${SACA_FRONTEND_URL:-http://localhost:5173}"
      SACA_TOKEN_SECRETO: "${SACA_TOKEN_SECRETO:?Define SACA_TOKEN_SECRETO en el archivo .env (ver .env.example)}"
      SACA_ADMIN_CORREO: "${SACA_ADMIN_CORREO:-}"
      SACA_ADMIN_NOMBRE: "${SACA_ADMIN_NOMBRE:-}"
      SACA_ADMIN_CONTRASENIA: "${SACA_ADMIN_CONTRASENIA:-}"
    ports:
      - "8080:8080"

volumes:
  saca_mysql_data: