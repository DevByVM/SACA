# 🔌 CONEXIÓN A MYSQL (Puerto estándar 3306)
# IMPORTANTE: Cambia "nombre_de_tu_base_de_datos" por el nombre real de tu esquema en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/saca_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ⚙️ CONFIGURACIÓN DE JPA / HIBERNATE PARA MYSQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# "update" creará la tabla "disponibilidades_semanales" automáticamente si no existe en tu MySQL
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola de IntelliJ para monitorear las pruebas
spring.jpa.show-sql=true