spring.application.name=saca-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/saca_mvp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:saca_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:saca_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/El_Salvador
