spring.application.name=saca-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/saca_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}




spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/El_Salvador

# Token de sesion: la clave de firma solo se toma del entorno (minimo 32 bytes).
# Sin SACA_TOKEN_SECRETO el backend no arranca, salvo que en desarrollo se defina
# SACA_TOKEN_CLAVE_TEMPORAL_PERMITIDA=true para usar una clave temporal.
saca.seguridad.token.secreto=${SACA_TOKEN_SECRETO:}
saca.seguridad.token.duracion=8h
saca.seguridad.token.clave-temporal-permitida=${SACA_TOKEN_CLAVE_TEMPORAL_PERMITIDA:false}

# Correo de activacion de cuentas. El servidor SMTP se configura solo por entorno:
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
# spring.mail.host no se define aqui a proposito: sin SPRING_MAIL_HOST no se crea el cliente SMTP
# y el correo queda "no disponible"; nunca se simula un envio. En local se usa Mailpit
# (perfil "correo" de docker-compose.correo.yml): SPRING_MAIL_HOST=localhost y SPRING_MAIL_PORT=1025.
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SACA_CORREO_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SACA_CORREO_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SACA_CORREO_SMTP_STARTTLS_OBLIGATORIO:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SACA_CORREO_TIMEOUT_CONEXION_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SACA_CORREO_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SACA_CORREO_TIMEOUT_MS:10000}
# Remitente de los correos y direccion publica del frontend (base del enlace de activacion)
saca.correo.remitente=${SACA_CORREO_REMITENTE:}
saca.correo.url-frontend=${SACA_FRONTEND_URL:}

# Limites de solicitudes por cliente frente al abuso. Valores por defecto; cada uno
# se puede cambiar con su variable de entorno. Estado en memoria: valido solo con una instancia del backend.
# La IP del cliente es la de la conexion. X-Forwarded-For solo se usa si la conexion viene de un proxy
# declarado en SACA_PROXIES_CONFIABLES (rangos CIDR separados por comas; vacio = ningun proxy es confiable).
# forward-headers-strategy=none impide que Tomcat confie por su cuenta en cabeceras reenviadas (con "native"
# confiaria en cualquier IP privada, como la puerta de enlace de Docker).
server.forward-headers-strategy=none
saca.red.proxies-confiables=${SACA_PROXIES_CONFIABLES:}
# Redes compartidas (campus, laboratorios) en CIDR: sus limites se multiplican, sin quedar exentas.
# En IPv6 conviene declarar prefijos /64 o mas amplios (/56, /48...): los limites individuales se cuentan
# por /64, y un rango mas estrecho deja en un mismo /64 direcciones con y sin multiplicador. Si un rango
# se solapa con un bloque /48, todo ese bloque usa el limite agregado de red compartida
saca.red.redes-compartidas=${SACA_IP_REDES_COMPARTIDAS:}
saca.limites.multiplicador-redes-compartidas=${SACA_LIMITE_MULTIPLICADOR_REDES_COMPARTIDAS:10}
saca.limites.max-claves=${SACA_LIMITE_MAX_CLAVES:50000}
# Inicios de sesion fallidos por cliente (independiente del bloqueo de 3 fallos por cuenta durante 5 minutos)
saca.limites.login.fallos-por-10-minutos=${SACA_LIMITE_LOGIN_FALLOS_10_MIN:30}
saca.limites.login.fallos-por-24-horas=${SACA_LIMITE_LOGIN_FALLOS_24_H:200}
# Registro y reenvio de activacion (contador comun)
saca.limites.registro.por-10-minutos=${SACA_LIMITE_REGISTRO_10_MIN:20}
saca.limites.registro.por-24-horas=${SACA_LIMITE_REGISTRO_24_H:100}
# Consulta y activacion de enlaces
saca.limites.activacion.por-minuto=${SACA_LIMITE_ACTIVACION_MIN:30}
# Correos enviados por hora en todo el sistema
saca.limites.correo.por-hora=${SACA_LIMITE_CORREO_HORA:500}
